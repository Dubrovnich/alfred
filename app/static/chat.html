<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alfred</title>
<style>
  :root {
    --bg: #E9EDF0;
    --surface: #FFFFFF;
    --ink: #16202A;
    --ink-soft: #5B6674;
    --line: #D3DAE0;
    --brass: #A88A4F;
    --brass-deep: #8A7040;
    --alert: #B3362E;
    --alert-bg: #FBF1F0;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: calc(14px + env(safe-area-inset-top)) 20px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.01em;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg a { color: var(--brass-deep); font-weight: 600; }
  .msg.guest {
    align-self: flex-end;
    background: var(--ink);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.alfred {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg.life {
    align-self: stretch;
    max-width: none;
    background: var(--alert-bg);
    border: 1px solid var(--alert);
    color: var(--ink);
    border-radius: 12px;
    font-weight: 500;
  }
  .msg.system {
    align-self: center;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    padding: 4px 0;
  }

  .host-card {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--brass);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
  }
  .host-card a {
    display: inline-block;
    margin-top: 6px;
    color: var(--brass-deep);
    font-weight: 600;
    text-decoration: none;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .chips button {
    font: inherit;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .chips button:active { background: var(--bg); }

  .typing {
    align-self: flex-start;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 6px 14px;
  }

  .emergency {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 20px;
    font-size: 13px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    color: var(--alert);
  }
  .emergency a { color: inherit; font-weight: 600; text-decoration: none; }
  .emergency a:focus-visible, .chips button:focus-visible, .send:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  form {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
  }
  textarea {
    flex: 1;
    font: inherit;
    resize: none;
    max-height: 120px;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  textarea:focus { outline: none; border-color: var(--brass); background: var(--surface); }
  .send {
    font: inherit;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    background: var(--brass);
    color: #fff;
    cursor: pointer;
    min-height: 42px;
  }
  .send:disabled { opacity: 0.5; cursor: default; }

  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: rise 160ms ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>
<body>

<header>
  <h1 id="property-name">Alfred</h1>
  <p>Alfred, the apartment assistant</p>
</header>

<main id="thread" aria-live="polite"></main>

<div class="emergency">
  <a href="tel:112">Emergency: call 112</a>
  <a id="host-link" href="#">Call host</a>
</div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Ask about the apartment…" aria-label="Message"></textarea>
  <button class="send" id="send" type="submit">Send</button>
</form>

<script>
  const token = location.pathname.split("/")[2];
  const base = `/a/${token}`;
  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("composer");

  const sidKey = `alfred-session-${token}`;
  let sessionId = localStorage.getItem(sidKey);
  if (!sessionId) {
    sessionId = crypto.randomUUID().replace(/-/g, "");
    localStorage.setItem(sidKey, sessionId);
  }

  function linkify(text) {
    const esc = text.replace(/\*\*/g, "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    return esc.replace(/https?:\/\/[^\s<]+/g, u => {
      const label = /youtu\.?be/.test(u) ? "Watch the video" : /google\.com\/maps/.test(u) ? "Open in Maps" : u;
      return `<a href="${u}" target="_blank" rel="noopener">${label}</a>`;
    });
  }

  function add(kind, text) {
    const el = document.createElement("div");
    el.className = `msg ${kind}`;
    el.innerHTML = linkify(text);
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
    return el;
  }

  function addHostCard(host) {
    const el = document.createElement("div");
    el.className = "host-card";
    el.innerHTML = `Reach ${host.name} directly<br><a href="tel:${host.phone.replace(/\s/g, "")}">${host.phone}</a>`;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  function addChips(chips) {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    chips.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.onclick = () => { wrap.remove(); ask(c); };
      wrap.appendChild(b);
    });
    thread.appendChild(wrap);
  }

  async function boot() {
    try {
      const r = await fetch(`${base}/bootstrap`);
      const d = await r.json();
      document.getElementById("property-name").textContent = d.property_name;
      document.title = `Alfred — ${d.property_name}`;
      const hl = document.getElementById("host-link");
      hl.textContent = `Call ${d.host.name}`;
      hl.href = `tel:${d.host.phone.replace(/\s/g, "")}`;
      add("alfred", d.greeting);
      addChips(d.chips);
    } catch (e) {
      add("system", "Couldn't load this apartment. Try tapping the tag again.");
    }
  }

  async function ask(text) {
    add("guest", text);
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;
    const typing = add("typing", "Alfred is writing…");
    typing.className = "typing";
    try {
      const r = await fetch(`${base}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const d = await r.json();
      typing.remove();
      add(d.kind === "life" ? "life" : "alfred", d.reply);
      if (d.host) addHostCard(d.host);
    } catch (e) {
      typing.remove();
      add("system", "No connection. Check the Wi-Fi and try again.");
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) ask(text);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  boot();
</script>
</body>
</html>
